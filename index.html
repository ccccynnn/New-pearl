<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fceef2">
  <title>珍珠輪班行事曆</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink:#fdf3f5; --gold-border:#d4af37; --card-bg:rgba(255,255,255,.75);
      --text-main:#5c414d; --text-sub:#8c6b79;
      --shift-off-bg:#e2f3e8; --shift-off-text:#2d6a4f;
      --shift-night-bg:#eae4f8; --shift-night-text:#5e4b8b;
      --shift-day-bg:#fdf0d5; --shift-day-text:#8d5b00;
    }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
    body {
      font-family:'Noto Serif TC',serif;
      background:#f8e9ed url('https://img.freepik.com/free-photo/vintage-pink-floral-patterned-background_53876-104085.jpg') repeat center/cover fixed;
      color:var(--text-main);
      padding:max(20px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(80px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left));
      display:flex; flex-direction:column; align-items:center; min-height:100vh; position:relative; overflow-x:hidden;
    }
    .header { text-align:center; margin-bottom:12px; position:relative; }
    .header-crown {
      width:45px; height:45px; margin:0 auto 5px;
      background:radial-gradient(circle,#fcf6ba 0%,#d4af37 100%); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 10px rgba(212,175,55,.5); border:2px solid #fff; font-size:20px;
    }
    .title-main { font-size:24px; font-weight:700; color:#5c3846; text-shadow:1px 1px 2px rgba(255,255,255,.8); letter-spacing:2px; }
    .title-sub { font-family:'Cinzel',serif; font-size:13px; color:#a07a8b; font-style:italic; letter-spacing:1px; }
    .ornate-card {
      width:100%; max-width:420px; background:var(--card-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      border-radius:20px; border:2px solid #f3d5df;
      box-shadow:inset 0 0 0 3px rgba(212,175,55,.4),0 8px 25px rgba(160,120,135,.2);
      padding:15px; margin-bottom:15px; position:relative;
    }
    .calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 5px; }
    .nav-btn {
      background:rgba(255,255,255,.8); border:1px solid #d4af37; border-radius:50%; width:32px; height:32px;
      display:flex; align-items:center; justify-content:center; color:#7a5061; font-size:14px; cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,.05);
    }
    .month-display { font-size:20px; font-weight:700; color:#4a2e3a; }
    .today-btn {
      background:linear-gradient(135deg,#fff 0%,#fbe3eb 100%); border:1px solid #d4af37; border-radius:15px;
      padding:4px 12px; font-size:13px; color:#6b4353; font-weight:600; box-shadow:0 2px 4px rgba(0,0,0,.05);
    }
    .weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-weight:600; color:#6b4d5b; margin-bottom:8px; font-size:14px; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .day-cell {
      background:rgba(255,255,255,.6); border-radius:8px; min-height:52px; padding:3px; display:flex;
      flex-direction:column; align-items:center; position:relative; border:1px solid rgba(240,210,220,.5);
    }
    .day-cell.other-month { opacity:.35; }
    .day-cell.today { border:2px solid #b388ff; box-shadow:0 0 8px rgba(179,136,255,.4); }
    .day-number { font-size:12px; font-weight:600; color:#4a333f; margin-bottom:3px; }
    .shift-tag { width:100%; padding:2px 0; border-radius:5px; font-size:11px; text-align:center; font-weight:600; }
    .shift-off { background-color:var(--shift-off-bg); color:var(--shift-off-text); }
    .shift-night { background-color:var(--shift-night-bg); color:var(--shift-night-text); }
    .shift-day { background-color:var(--shift-day-bg); color:var(--shift-day-text); }
    .info-section { display:flex; justify-content:space-between; align-items:center; }
    .shift-info-title { font-size:13px; color:#8c6b79; margin-bottom:4px; }
    .shift-info-value { font-size:18px; font-weight:700; color:#4a2e3a; display:flex; align-items:center; gap:6px; }
    .countdown-box { text-align:right; }
    .countdown-time { font-size:18px; font-weight:700; color:#4a2e3a; }
    .mood-title { font-size:13px; color:#8c6b79; margin-bottom:8px; text-align:center; }
    .mood-selector { display:flex; justify-content:space-around; }
    .mood-item { display:flex; flex-direction:column; align-items:center; font-size:20px; cursor:pointer; opacity:.7; transition:transform .2s; }
    .mood-item.active { opacity:1; transform:scale(1.15); }
    .mood-label { font-size:10px; color:#6b4d5b; margin-top:2px; }
    .note-input { width:100%; border:1px solid #e0c2cd; border-radius:12px; padding:8px 12px; background:rgba(255,255,255,.7); font-family:inherit; font-size:13px; outline:none; color:#4a333f; }
    .bottom-nav {
      position:fixed; bottom:max(10px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
      width:calc(100% - 30px); max-width:410px; height:60px; background:rgba(255,255,255,.85);
      backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); border-radius:30px; border:2px solid #f0d0db;
      box-shadow:0 10px 25px rgba(120,80,95,.15); display:flex; justify-content:space-around; align-items:center; z-index:100;
    }
    .nav-item { display:flex; flex-direction:column; align-items:center; color:#8c6b79; font-size:11px; text-decoration:none; }
    .nav-item.active { color:#5c3846; font-weight:700; }
    .nav-icon { font-size:18px; margin-bottom:2px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-crown">👑</div>
    <h1 class="title-main">珍珠輪班行事曆</h1>
    <p class="title-sub">Pearl Shift Calendar</p>
  </header>
  <main class="ornate-card">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth">&lt;</button>
      <div class="month-display" id="monthDisplay">2026 年 10 月</div>
      <button class="nav-btn" id="nextMonth">&gt;</button>
      <button class="today-btn" id="todayBtn">今天</button>
    </div>
    <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="calendar-grid" id="calendarGrid"><!-- 由 JS 動態生成 --></div>
  </main>
  <section class="ornate-card info-section">
    <div>
      <div class="shift-info-title">今日排班</div>
      <div class="shift-info-value"><span>🌙</span> 夜班</div>
      <div style="font-size:11px;color:#8c6b79;margin-top:2px;">19:30 - 07:30</div>
    </div>
    <div class="countdown-box">
      <div class="shift-info-title">距離下次上班</div>
      <div class="countdown-time">2 <span style="font-size:12px;">天</span> 12 <span style="font-size:12px;">小時</span></div>
    </div>
  </section>
  <section class="ornate-card">
    <div class="mood-title">今日心情・每日表情標記</div>
    <div class="mood-selector">
      <div class="mood-item active">😍<span class="mood-label">超開心</span></div>
      <div class="mood-item">😊<span class="mood-label">開心</span></div>
      <div class="mood-item">😌<span class="mood-label">平靜</span></div>
      <div class="mood-item">😐<span class="mood-label">普通</span></div>
      <div class="mood-item">😫<span class="mood-label">疲憊</span></div>
      <div class="mood-item">😤<span class="mood-label">壓力</span></div>
      <div class="mood-item">😭<span class="mood-label">低落</span></div>
    </div>
  </section>
  <section class="ornate-card">
    <div class="shift-info-title" style="margin-bottom:6px;">✏️ 當日備註</div>
    <input type="text" class="note-input" placeholder="例如：加班、約會、提醒事項...">
  </section>
  <nav class="bottom-nav">
    <a href="#" class="nav-item active"><span class="nav-icon">📅</span><span>行事曆</span></a>
    <a href="#" class="nav-item"><span class="nav-icon">⚜️</span><span>規則</span></a>
    <a href="#" class="nav-item"><span class="nav-icon">🔄</span><span>未來排程</span></a>
    <a href="#" class="nav-item"><span class="nav-icon">🕒</span><span>統計</span></a>
  </nav>
  <script>
    // ServiceWorker 註冊 (Safari PWA 支援)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
      });
    }

    // 簡易日曆生成邏輯示範
    const grid = id('calendarGrid');
    function renderDemoCalendar() {
      // 模擬生成 2026年10月（31天）
      const shifts = ['off', 'off', 'off', 'off', 'off', 'off', 'off', 'off', 'off', 'off', 'night', 'night', 'night', 'night', 'off', 'off', 'off', 'night', 'night', 'night', 'off', 'off', 'off', 'day', 'day', 'day', 'day', 'off', 'off', 'off', 'off'];
      const shiftNames = { off: '休假', night: '夜班', day: '日班' };
      let html = '';
      for(let i = 27; i <= 30; i++) {
        html += `<div class="day-cell other-month"><span class="day-number">${i}</span><div class="shift-tag shift-off">休假</div></div>`;
      }
      for(let d = 1; d <= 31; d++) {
        const shiftType = shifts[(d - 1) % shifts.length];
        const isToday = d === 10;
        html += `<div class="day-cell ${isToday ? 'today' : ''}"><span class="day-number">${d}</span><div class="shift-tag shift-${shiftType}">${shiftNames[shiftType]}</div></div>`;
      }
      grid.innerHTML = html;
    }
    function id(str) { return document.getElementById(str); }
    renderDemoCalendar();
  </script>
</body>
</html>
